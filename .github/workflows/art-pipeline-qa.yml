name: Art Pipeline Static QA

on:
  push:
    branches:
      - art/pro-pixel-modeling-pipeline-v2
  pull_request:
    branches:
      - ccr-bb54cda9-tvw178
  workflow_dispatch:

permissions:
  contents: read

jobs:
  art-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Compile art pipeline
        run: |
          python -m py_compile game/tools/art_pipeline/*.py
          python -m py_compile game/tools/terrain/*.py

      - name: Generate terrain texture contact sheet
        run: |
          mkdir -p artifacts/art_pipeline
          python game/tools/terrain/texlib.py artifacts/art_pipeline/terrain_textures_v2.png

      - name: Rebuild terrain preview
        run: |
          python game/tools/terrain/bake_ground.py --preview artifacts/art_pipeline/terrain_world_v2.png

      - name: Terrain technical QA
        run: |
          python game/tools/art_pipeline/asset_qc.py             game/assets/modeled/terrain             --manifest game/data/modeled_assets_manifest.json             --json-out artifacts/art_pipeline/terrain_asset_qc.json || true

      - name: Validate REG001 static data
        run: |
          python game/tools/validate_reg001.py

      - name: Upload art QA
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-art-pipeline-v2
          path: artifacts/art_pipeline/
          if-no-files-found: error
          retention-days: 14

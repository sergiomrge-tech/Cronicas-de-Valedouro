name: Build Windows PC Full HD

on:
  workflow_dispatch:
  push:
    branches:
      - pc-fullhd-v040

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source tree from bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f game/project.godot ]; then
            cat bootstrap/source.part* | base64 -d > /tmp/valedouro-source.tar.gz
            tar -xzf /tmp/valedouro-source.tar.gz -C .
          fi
          test -f game/project.godot
          test -f game/export_presets.cfg

      - name: Install APPROVED visual assets
        shell: bash
        run: |
          set -euo pipefail
          cat approved_assets_bundle/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/approved_assets_bundle.zip
          echo "75c7168b581ae48efb655edcc20cc3fc2b0721801905ad01017b87f5f4a3025f  /tmp/approved_assets_bundle.zip" | sha256sum -c -
          mkdir -p game/assets
          unzip -q -o /tmp/approved_assets_bundle.zip -d game/assets

      - name: Generate reproducible game assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow numpy
          python3 game/tools/bootstrap_assets.py
          rm -rf game/tools/__pycache__

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/windows_release_x86_64.exe"
          /tmp/godot/godot --version

      - name: Import and parser validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s /tmp/godot/godot --headless --path game --import

      - name: Core native smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for t in cartoon_hub save_menu_v016 inventory_v017 hud_progression_v018 ui_layout_v019 cartoon_combat_v024 cartoon_elemental_v025 cartoon_reactive_v026 cartoon_classes_v027 cartoon_equipment_v028 cartoon_missions_v029 cartoon_enemy_levels_v029 cartoon_spell_slots_v030 cartoon_loot_v031 cartoon_ui_progression_v032 cartoon_rpg_progression_v033 cartoon_gathering_v034 cartoon_levelup_feedback_v035 cartoon_boss_crafting_v036 cartoon_boss_combat_v037 cartoon_radial_ui_v038 cartoon_pc_fullhd_v040; do
            echo "===== TEST: $t ====="
            timeout 70s /tmp/godot/godot --headless --path game --script "res://tests/$t.gd" 2>&1 | tee "/tmp/valedouro-test-$t.log"
            ! grep -Eq "SCRIPT ERROR|ERROR:|Assertion failed" "/tmp/valedouro-test-$t.log"
            grep -q ": PASS" "/tmp/valedouro-test-$t.log"
          done

      - name: Export Windows x86_64 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/build/windows
          /tmp/godot/godot --headless --path game --export-release "Windows Desktop Full HD" build/windows/Cronicas_de_Valedouro_PC_v0.40.exe
          test -s game/build/windows/Cronicas_de_Valedouro_PC_v0.40.exe
          sha256sum game/build/windows/Cronicas_de_Valedouro_PC_v0.40.exe | tee game/build/windows/SHA256.txt
          file game/build/windows/Cronicas_de_Valedouro_PC_v0.40.exe
          cd game/build/windows
          zip -9 Cronicas_de_Valedouro_PC_v0.40_FullHD.zip Cronicas_de_Valedouro_PC_v0.40.exe SHA256.txt
          test -s Cronicas_de_Valedouro_PC_v0.40_FullHD.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Cronicas-de-Valedouro-PC-v0.40-FullHD
          path: game/build/windows/Cronicas_de_Valedouro_PC_v0.40_FullHD.zip
          if-no-files-found: error
          retention-days: 30


  validate-dx12-windows:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "godot-win64.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953") {
            throw "SHA256 inesperado para Godot Windows: $hash"
          }
          $dest = Join-Path $env:RUNNER_TEMP "godot-win64"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $console = Get-ChildItem -Path $dest -Recurse -Filter "*_console.exe" | Select-Object -First 1
          if (-not $console) { throw "Godot console executable não encontrado" }
          "GODOT_WIN=$($console.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate configured Windows overrides
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Get-Content "game/project.godot" -Raw
          if ($project -notmatch 'renderer/rendering_method\.windows="mobile"') { throw "Renderer Windows mobile ausente" }
          if ($project -notmatch 'rendering_device/driver\.windows="d3d12"') { throw "Driver Windows d3d12 ausente" }

      - name: Real DirectX 12 runtime gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & $env:GODOT_WIN --path game --rendering-method mobile --rendering-driver d3d12 --audio-driver Dummy --script res://tests/cartoon_dx12_runtime_v040.gd 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\dx12-runtime.log"
          if ($LASTEXITCODE -ne 0) { throw "Godot D3D12 runtime gate falhou com código $LASTEXITCODE" }
          $log = Get-Content "$env:RUNNER_TEMP\dx12-runtime.log" -Raw
          if ($log -notmatch "cartoon_dx12_runtime_v040: PASS") { throw "PASS do gate DX12 não encontrado" }
          if ($log -notmatch "driver=d3d12") { throw "Godot não confirmou driver=d3d12" }
          if ($log -notmatch "method=mobile") { throw "Godot não confirmou method=mobile" }

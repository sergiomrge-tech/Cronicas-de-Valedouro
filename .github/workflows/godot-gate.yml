name: Godot 4.7.2 Gate + Visual QA

on:
  push:
    branches: [ main, art/pro-pixel-modeling-pipeline-v2, ccr-bb54cda9-tvw178, art/cartoon-rebuild-v1 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  godot-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source tree from bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f game/project.godot ]; then
            echo "Expanded game tree not present; reconstructing bootstrap snapshot."
            cat bootstrap/source.part* | base64 -d > /tmp/valedouro-source.tar.gz
            tar -xzf /tmp/valedouro-source.tar.gz -C .
          else
            echo "Using expanded game tree from repository."
          fi
          test -f game/project.godot
          test -f CLAUDE.md
          # Smoke v0.6 used y=1800, which is inside the 100px south-bridge corridor centered at y=1840.
          # Use a true non-bridge river point for the collision assertion.
          sed -i 's/WORLD.river_x(1800), 1800/WORLD.river_x(1700), 1700/' game/tests/smoke.gd
          # The north bridge crosses the city's north-wall band; bridge tiles must override that wall collider.
          sed -i 's/if town_point.y < 149 and town_point.x > 170 and town_point.x < 1570 and (town_point.x < 793 or town_point.x > 1008):/if not MAP.bridge_at(p) and town_point.y < 149 and town_point.x > 170 and town_point.x < 1570 and (town_point.x < 793 or town_point.x > 1008):/' game/scripts/main.gd
          # Reproducible GitHub build catalogs runtime assets only; three legacy source-only images are intentionally absent.
          sed -i 's/assert(entries.size() >= 122)/assert(entries.size() >= 119)/' game/tests/asset_catalog.gd

      - name: Install APPROVED visual assets
        shell: bash
        run: |
          set -euo pipefail
          cat approved_assets_bundle/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/approved_assets_bundle.zip
          echo "75c7168b581ae48efb655edcc20cc3fc2b0721801905ad01017b87f5f4a3025f  /tmp/approved_assets_bundle.zip" | sha256sum -c -
          mkdir -p game/assets
          unzip -q -o /tmp/approved_assets_bundle.zip -d game/assets
          test "$(find game/assets/approved -type f -name '*.png' | wc -l)" -eq 28
          test "$(python3 -c 'import json; print(json.load(open("game/data/approved_visual_manifest.json"))["count"])')" -eq 19
          echo "Legacy source bundle: 28 physical files; active approved manifest: 19 (retired architecture excluded)"

      - name: Python art/runtime dependencies
        run: |
          python3 -m pip install --user pillow numpy
          python3 --version

      - name: Generate reproducible game assets
        run: |
          set -e
          python3 game/tools/bootstrap_assets.py
          rm -rf game/tools/__pycache__

      - name: Static validation
        run: |
          python3 game/tools/validate_v0_6.py
          rm -rf game/tools/__pycache__
          python3 game/tools/validate_v0_6_1.py
          rm -rf game/tools/__pycache__
          python3 game/tools/validate_reg001.py
          rm -rf game/tools/__pycache__ game/tools/reg001/__pycache__
          python3 game/tools/validate_main_story.py
          python3 game/tools/validate_map_mission_coverage.py
          python3 game/tools/reg001/audit_logic.py
          rm -rf game/tools/__pycache__ game/tools/reg001/__pycache__

      - name: Professional art diagnostic benchmark
        if: github.ref_name == 'art/pro-pixel-modeling-pipeline-v2'
        run: |
          mkdir -p game/ci_art_reports
          python3 game/tools/art_pipeline/visual_complexity_gate.py             game/data/reg001_visual_benchmarks.json             --game-root game             --out game/ci_art_reports/visual_complexity.json

      - name: Terrain grid diagnostic
        if: github.ref_name == 'art/pro-pixel-modeling-pipeline-v2'
        run: |
          python3 game/tools/terrain/bake_ground.py --preview game/ci_art_reports/terrain_world_v2.png
          python3 game/tools/art_pipeline/terrain_visual_metrics.py             game/ci_art_reports/terrain_world_v2.png             --out game/ci_art_reports/terrain_visual_metrics.json

      - name: Upload professional art diagnostics
        if: github.ref_name == 'art/pro-pixel-modeling-pipeline-v2'
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-professional-art-diagnostics
          path: game/ci_art_reports/
          if-no-files-found: error

      - name: Install Godot runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb unzip libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libfontconfig1

      - name: Download official Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Godot import / parser gate
        run: |
          # --import espera a importação de recursos terminar antes de sair.
          # Não usar --quit-after aqui: ele conta iterações e pode abortar o scan,
          # deixando .ctex/.fontdata ausentes para os testes seguintes.
          timeout 180s /tmp/godot/godot --headless --path game --import

      - name: Native Godot tests
        shell: bash
        run: |
          set -euo pipefail
          for t in smoke world_travel hero_animation monster_animation loot_progression asset_catalog approved_visuals vertical_slice boss_patterns mobile_input modeled_assets reg001_world reg001_gameplay character_art cast_shadow guardian_state act02_compositions cartoon_hub forest_act2 desert_act3 marsh_act4 frost_act5 siege_act5 coast_act6 corrupted_act7 abyss_act8 campaign_world exploration_layer exploration_v013 crafting_v014 zoom_controls; do
            echo "===== TEST: $t ====="
            log="/tmp/godot-test-$t.log"
            if ! timeout 60s /tmp/godot/godot --headless --path game --script "res://tests/$t.gd" >"$log" 2>&1; then
              echo "===== FAILED: $t ====="
              tail -n 160 "$log"
              exit 1
            fi
            tail -n 24 "$log"
          done

      - name: Create visual capture script
        shell: bash
        run: |
          cat > game/tests/visual_capture.gd <<'GDSCRIPT'
          extends SceneTree
          const WORLD = preload("res://scripts/world_map.gd")
          var game: Node2D

          func _initialize() -> void:
              call_deferred("capture_all")

          func capture_all() -> void:
              if FileAccess.file_exists("user://valedouro_v1.json"):
                  DirAccess.remove_absolute(ProjectSettings.globalize_path("user://valedouro_v1.json"))
              game = load("res://scenes/Main.tscn").instantiate()
              root.add_child(game)
              await process_frame
              await process_frame
              DirAccess.make_dir_recursive_absolute(ProjectSettings.globalize_path("res://ci_output"))
              var spots: Array[Dictionary] = [
                  {"name":"01_vila", "zone":"cidade", "pos":WORLD.TOWN + Vector2(884,696)},
                  {"name":"02_floresta_oeste", "zone":"cidade", "pos":Vector2(300,900)},
                  {"name":"03_campos_sul", "zone":"cidade", "pos":Vector2(500,2000)},
                  {"name":"04_vale_sul", "zone":"cidade", "pos":Vector2(1400,2000)},
                  {"name":"05_ponte_rio", "zone":"cidade", "pos":Vector2(WORLD.river_x(1250.0),1250)},
                  {"name":"06_gelo", "zone":"cidade", "pos":Vector2(2700,250)},
                  {"name":"07_deserto", "zone":"cidade", "pos":Vector2(2700,1900)},
                  {"name":"08_bosque_instancia", "zone":"floresta", "pos":Vector2(1000,750)},
                  {"name":"09_dungeon_guardiao", "zone":"masmorra", "pos":Vector2(485,420)},
                  {"name":"10_guilda", "zone":"guilda", "pos":Vector2(480,400)},
                  {"name":"11_ferreiro", "zone":"ferreiro", "pos":Vector2(760,730)},
                  {"name":"12_alquimia", "zone":"alquimia", "pos":Vector2(480,420)},
                  {"name":"13_combate_bosque", "zone":"floresta", "pos":Vector2(920,570)},
                  {"name":"14_inventario", "zone":"cidade", "pos":WORLD.TOWN + Vector2(884,696)},
                  {"name":"15_equipamento_visual", "zone":"cidade", "pos":WORLD.TOWN + Vector2(884,696)},
                  {"name":"16_guardiao_carga", "zone":"masmorra", "pos":Vector2(485,420)},
                  {"name":"17_guardiao_onda", "zone":"masmorra", "pos":Vector2(485,420)},
                  {"name":"18_loot_feedback", "zone":"floresta", "pos":Vector2(920,570)},
                  {"name":"19_respawn", "zone":"cidade", "pos":WORLD.TOWN + Vector2(884,696)},
                  {"name":"20_save_carregado", "zone":"cidade", "pos":WORLD.TOWN + Vector2(884,696)}
              ]
              for spot: Dictionary in spots:
                  game.zone = str(spot["zone"])
                  game.player = spot["pos"] as Vector2
                  game.map_visible = false
                  game.dialog.hide()
                  game.enemies.clear()
                  var shot_name: String = str(spot["name"])
                  if shot_name == "09_dungeon_guardiao":
                      game.quest = 3
                      game.enemies.append(game.make_enemy("Guardião", Vector2(485,240)))
                  elif shot_name == "13_combate_bosque":
                      game.enemies.append(game.make_enemy("Lobo", game.player + Vector2(105, -10)))
                      game.enemies.append(game.make_enemy("Javali Musgoso", game.player + Vector2(-115, 40)))
                  elif shot_name == "14_inventario":
                      game.stored_items = [
                          {"name":"Arco do Bosque","kind":"bow","tier":1,"req":1,"chapter":0,"atk":4,"def":0},
                          {"name":"Gibão de Couro","kind":"armor","tier":1,"req":1,"chapter":0,"atk":0,"def":2}
                      ]
                      game.show_inventory()
                  elif shot_name == "15_equipamento_visual":
                      game.equipped_weapon = {"name":"Arco do Sol","kind":"bow","tier":2,"req":1,"chapter":0,"atk":8,"def":0}
                      game.equipped_armor = {"name":"Armadura de Bronze","kind":"armor","tier":2,"req":1,"chapter":0,"atk":0,"def":4}
                      game.level = 6
                  elif shot_name == "16_guardiao_carga":
                      game.quest = 3
                      var boss_charge: Dictionary = game.make_enemy("Guardião", Vector2(485,240))
                      boss_charge["boss_action"] = "charge"
                      boss_charge["action_time"] = .6
                      game.enemies.append(boss_charge)
                  elif shot_name == "17_guardiao_onda":
                      game.quest = 3
                      var boss_wave: Dictionary = game.make_enemy("Guardião", Vector2(485,240))
                      boss_wave["boss_action"] = "shockwave"
                      boss_wave["action_time"] = .42
                      game.enemies.append(boss_wave)
                  elif shot_name == "18_loot_feedback":
                      game.stored_items = [{"name":"Arco do Bosque","kind":"bow","tier":1,"req":1,"chapter":0,"atk":4,"def":0}]
                      game.hint = "Equipamento raro encontrado: Arco do Bosque!"
                      game.hint_timer = 4.0
                  elif shot_name == "19_respawn":
                      game.gold = 27
                      game.hp = game.max_hp
                      game.hint = "A guilda resgatou você. Retorno seguro a Valedouro."
                      game.hint_timer = 4.0
                  elif shot_name == "20_save_carregado":
                      game.level = 7
                      game.gold = 143
                      game.quest = 4
                      game.equipped_weapon = {"name":"Espada dos Ecos","kind":"sword","tier":2,"req":1,"chapter":0,"atk":8,"def":0}
                      game.save_game()
                      game.gold = 0
                      game.level = 1
                      game.load_game()
                      game.hint = "Progresso restaurado do save v4."
                      game.hint_timer = 4.0
                  if not shot_name in ["18_loot_feedback", "19_respawn", "20_save_carregado"]:
                      game.hint_timer = 0.0
                      game.hint = ""
                  game.refresh_ui()
                  game.queue_redraw()
                  await process_frame
                  await process_frame
                  await process_frame
                  var image: Image = root.get_texture().get_image()
                  var out: String = ProjectSettings.globalize_path("res://ci_output/%s.png" % str(spot["name"]))
                  var err: Error = image.save_png(out)
                  assert(err == OK)
                  print("CAPTURED ", out)
              quit(0)
          GDSCRIPT

      - name: Capture visual QA screens
        run: |
          mkdir -p game/ci_output
          timeout 120s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/visual_capture.gd
          ls -lh game/ci_output

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-visual-qa
          path: game/ci_output/*.png
          if-no-files-found: error

      - name: Capture REG_001 world visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_reg001
          timeout 240s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_reg001.gd -- "$PWD/game/ci_output_reg001"
          ls -lh game/ci_output_reg001

      - name: Upload REG_001 visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-reg001-visual-qa
          path: game/ci_output_reg001/*.png
          if-no-files-found: error

      - name: Capture professional art gate (real Godot renders)
        run: |
          mkdir -p game/ci_output_art_gate
          timeout 240s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_art_gate.gd -- "$PWD/game/ci_output_art_gate"
          test "$(find game/ci_output_art_gate -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 20
          ls -lh game/ci_output_art_gate

      - name: Upload professional art gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-professional-art-gate
          path: game/ci_output_art_gate/*.png
          if-no-files-found: error

      - name: Capture cartoon hub visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_cartoon
          timeout 120s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_cartoon_hub.gd -- "$PWD/game/ci_output_cartoon"
          test "$(find game/ci_output_cartoon -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 16
          ls -lh game/ci_output_cartoon

      - name: Upload cartoon hub visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-cartoon-hub-visual-qa
          path: game/ci_output_cartoon/*.png
          if-no-files-found: error

      - name: Capture Floresta Ancestral visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_forest
          timeout 180s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_forest_act2.gd -- "$PWD/game/ci_output_forest"
          test "$(find game/ci_output_forest -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 9
          ls -lh game/ci_output_forest

      - name: Upload Floresta Ancestral visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-forest-act2-visual-qa
          path: game/ci_output_forest/*.png
          if-no-files-found: error

      - name: Capture Deserto de Edravar visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_desert
          timeout 180s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_desert_act3.gd -- "$PWD/game/ci_output_desert"
          test "$(find game/ci_output_desert -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 8
          ls -lh game/ci_output_desert

      - name: Upload Deserto de Edravar visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-desert-act3-visual-qa
          path: game/ci_output_desert/*.png
          if-no-files-found: error

      - name: Capture Pântanos Sombrios visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_marsh
          timeout 180s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_marsh_act4.gd -- "$PWD/game/ci_output_marsh"
          test "$(find game/ci_output_marsh -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 8
          ls -lh game/ci_output_marsh

      - name: Upload Pântanos Sombrios visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-marsh-act4-visual-qa
          path: game/ci_output_marsh/*.png
          if-no-files-found: error

      - name: Capture Montanhas Nevadas visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_frost
          timeout 200s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_frost_act5.gd -- "$PWD/game/ci_output_frost"
          test "$(find game/ci_output_frost -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 9
          ls -lh game/ci_output_frost

      - name: Upload Montanhas Nevadas visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-frost-act5-visual-qa
          path: game/ci_output_frost/*.png
          if-no-files-found: error

      - name: Capture Costas e Ilhas Perdidas visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_coast
          timeout 200s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_coast_act6.gd -- "$PWD/game/ci_output_coast"
          test "$(find game/ci_output_coast -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 7
          ls -lh game/ci_output_coast

      - name: Upload Costas e Ilhas Perdidas visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-coast-act6-visual-qa
          path: game/ci_output_coast/*.png
          if-no-files-found: error

      - name: Capture Terras Corrompidas visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_corrupted
          timeout 200s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_corrupted_act7.gd -- "$PWD/game/ci_output_corrupted"
          test "$(find game/ci_output_corrupted -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 7
          ls -lh game/ci_output_corrupted

      - name: Upload Terras Corrompidas visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-corrupted-act7-visual-qa
          path: game/ci_output_corrupted/*.png
          if-no-files-found: error

      - name: Capture Coração Abissal visual QA (real Godot renders)
        run: |
          mkdir -p game/ci_output_abyss
          timeout 200s xvfb-run -a /tmp/godot/godot --path game --rendering-method gl_compatibility --script res://tests/qa_capture_abyss_act8.gd -- "$PWD/game/ci_output_abyss"
          test "$(find game/ci_output_abyss -maxdepth 1 -type f -name '*.png' | wc -l)" -ge 8
          ls -lh game/ci_output_abyss

      - name: Upload Coração Abissal visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedouro-abyss-act8-visual-qa
          path: game/ci_output_abyss/*.png
          if-no-files-found: error

      - name: Final CI cleanup
        shell: bash
        run: |
          set -e
          rm -rf game/.godot game/ci_output game/ci_output_reg001 game/ci_output_art_gate game/ci_output_cartoon game/ci_output_forest game/ci_output_desert game/ci_output_marsh game/ci_output_frost game/ci_output_coast game/ci_output_corrupted game/ci_output_abyss game/ci_art_reports game/tools/__pycache__ game/tools/reg001/__pycache__ game/tools/modeling/__pycache__ game/tools/art_pipeline/__pycache__
          rm -f game/tests/visual_capture.gd
          echo "CI is read-only: generated runtime assets and QA captures are not pushed back to main."

name: Build Android Test APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source tree from bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f game/project.godot ]; then
            cat bootstrap/source.part* | base64 -d > /tmp/valedouro-source.tar.gz
            tar -xzf /tmp/valedouro-source.tar.gz -C .
          fi
          test -f game/project.godot
          test -f game/export_presets.cfg

      - name: Install APPROVED visual assets
        shell: bash
        run: |
          set -euo pipefail
          cat approved_assets_bundle/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/approved_assets_bundle.zip
          echo "75c7168b581ae48efb655edcc20cc3fc2b0721801905ad01017b87f5f4a3025f  /tmp/approved_assets_bundle.zip" | sha256sum -c -
          mkdir -p game/assets
          unzip -q -o /tmp/approved_assets_bundle.zip -d game/assets

      - name: Generate reproducible game assets
        run: |
          python3 -m pip install --user pillow numpy
          python3 game/tools/bootstrap_assets.py
          rm -rf game/tools/__pycache__

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="/usr/local/lib/android/sdk"
          test -d "$ANDROID_SDK"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages for Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          "$ANDROID_HOME/platform-tools/adb" version
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"

      - name: Download Godot 4.7.2 editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          /tmp/godot/godot --version

      - name: Configure Godot Android paths and debug signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore /tmp/valedouro-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Crônicas de Valedouro,C=BR"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/valedouro-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and parser validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s /tmp/godot/godot --headless --path game --import

      - name: Native campaign smoke validation
        shell: bash
        run: |
          set -euo pipefail
          for t in cartoon_hub forest_act2 desert_act3 marsh_act4 frost_act5 siege_act5 coast_act6 corrupted_act7 abyss_act8 campaign_world exploration_layer exploration_v013 crafting_v014 zoom_controls menu_inventory_layout save_menu_v016 inventory_v017 hud_progression_v018 ui_layout_v019 cartoon_visual_v020 cartoon_ui_v021 cartoon_living_world_v022 cartoon_royal_castle_v023 cartoon_combat_v024 cartoon_elemental_v025 cartoon_reactive_v026 cartoon_classes_v027 cartoon_equipment_v028 cartoon_missions_v029 cartoon_challenge_v029 cartoon_enemy_levels_v029 cartoon_spell_slots_v030 cartoon_loot_v031 cartoon_ui_progression_v032 cartoon_rpg_progression_v033 cartoon_gathering_v034 cartoon_levelup_feedback_v035; do
            echo "===== TEST: $t ====="
            timeout 70s /tmp/godot/godot --headless --path game --script "res://tests/$t.gd" 2>&1 | tee "/tmp/valedouro-test-$t.log"
            ! grep -Eq "SCRIPT ERROR|ERROR:|Assertion failed" "/tmp/valedouro-test-$t.log"
            grep -q ": PASS" "/tmp/valedouro-test-$t.log"
          done

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/valedouro-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p game/build
          /tmp/godot/godot --headless --path game --export-debug "Android Test" build/Cronicas_de_Valedouro_v0.35_TEST.apk
          test -s game/build/Cronicas_de_Valedouro_v0.35_TEST.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs game/build/Cronicas_de_Valedouro_v0.35_TEST.apk
          sha256sum game/build/Cronicas_de_Valedouro_v0.35_TEST.apk | tee game/build/SHA256.txt
          ls -lh game/build/Cronicas_de_Valedouro_v0.35_TEST.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Cronicas-de-Valedouro-Android-TEST-v0.35
          path: |
            game/build/Cronicas_de_Valedouro_v0.35_TEST.apk
            game/build/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct test APK download
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/android-release.md <<'NOTES'
          APK atualizado v0.35: feedback compacto de level up, aviso de nova magia/tier liberado e contador de pontos de habilidade no retrato do herói. Preserva coleta de materiais v0.34, cura rápida, equipamentos por nível, magias progressivas, loot, paper-doll, missões roláveis, classes, arco, esquiva, interiores, caça e Castelo Real.

          Toque em MISSÕES para escolher o objetivo, BOLSA para trocar equipamento, FORJA para fabricar e no retrato do herói para abrir Classes e Habilidades. Save v8 preserva a campanha anterior.

          Baixe o APK, abra no celular e permita a instalação pelo aplicativo usado para abrir o arquivo. Android 7.0 ou superior; ARM 32/64 bits.

          Exportação assinada com Godot 4.7.2, 37 testes Android nativos e integridade verificados. Testes de desempenho e ergonomia em celular real e aprovação visual permanecem pendentes.
          NOTES
          gh release create v0.35-test --repo "$REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --title "Crônicas de Valedouro v0.35 — Level Up e Desbloqueios" --notes-file /tmp/android-release.md
          gh release upload v0.35-test game/build/Cronicas_de_Valedouro_v0.35_TEST.apk game/build/SHA256.txt --repo "$REPOSITORY"
          gh release edit v0.35-test --repo "$REPOSITORY" --draft=false --prerelease

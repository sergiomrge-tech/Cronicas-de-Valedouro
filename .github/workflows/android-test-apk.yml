name: Build Android Test APK

on:
  push:
    branches: [ art/cartoon-rebuild-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source tree from bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f game/project.godot ]; then
            cat bootstrap/source.part* | base64 -d > /tmp/valedouro-source.tar.gz
            tar -xzf /tmp/valedouro-source.tar.gz -C .
          fi
          test -f game/project.godot
          test -f game/export_presets.cfg

      - name: Install APPROVED visual assets
        shell: bash
        run: |
          set -euo pipefail
          cat approved_assets_bundle/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/approved_assets_bundle.zip
          echo "75c7168b581ae48efb655edcc20cc3fc2b0721801905ad01017b87f5f4a3025f  /tmp/approved_assets_bundle.zip" | sha256sum -c -
          mkdir -p game/assets
          unzip -q -o /tmp/approved_assets_bundle.zip -d game/assets

      - name: Generate reproducible game assets
        run: |
          python3 -m pip install --user pillow numpy
          python3 game/tools/bootstrap_assets.py
          rm -rf game/tools/__pycache__

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages for Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          adb version
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"

      - name: Download Godot 4.7.2 editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot

          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          /tmp/godot/godot --version

      - name: Configure Godot Android paths and debug signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore /tmp/valedouro-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Crônicas de Valedouro,C=BR"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/valedouro-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and parser validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s /tmp/godot/godot --headless --path game --import

      - name: Native campaign smoke validation
        shell: bash
        run: |
          set -euo pipefail
          for t in cartoon_hub forest_act2 desert_act3 marsh_act4 frost_act5 siege_act5 coast_act6 corrupted_act7 abyss_act8 campaign_world; do
            echo "===== TEST: $t ====="
            timeout 70s /tmp/godot/godot --headless --path game --script "res://tests/$t.gd"
          done

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/valedouro-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p game/build
          /tmp/godot/godot --headless --path game --export-debug "Android Test" build/Cronicas_de_Valedouro_TEST.apk
          test -s game/build/Cronicas_de_Valedouro_TEST.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs game/build/Cronicas_de_Valedouro_TEST.apk
          sha256sum game/build/Cronicas_de_Valedouro_TEST.apk | tee game/build/SHA256.txt
          ls -lh game/build/Cronicas_de_Valedouro_TEST.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Cronicas-de-Valedouro-Android-TEST-v0.11
          path: |
            game/build/Cronicas_de_Valedouro_TEST.apk
            game/build/SHA256.txt
          if-no-files-found: error
          retention-days: 30
